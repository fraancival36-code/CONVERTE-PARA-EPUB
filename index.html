<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONVERSOR SIMPLES — Texto → EPUB</title>
    <meta name="theme-color" content="#0066FF">

    <script src="https://cdn.jsdelivr.net/npm/epub-gen-memory@1.0.2/dist/index.umd.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #050515;
            font-family: sans-serif;
            color: white;
            padding: 16px;
        }

        .caixa {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #66ddff;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #aaddff;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #0088cc;
            border-radius: 8px;
            background: rgba(0, 30, 60, 0.8);
            color: white;
            font-size: 14px;
        }

        textarea {
            min-height: 250px;
            resize: vertical;
        }

        .botao {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #008844, #00aa55);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .botao:hover { opacity: 0.9; }

        .botao-limpar {
            background: linear-gradient(90deg, #cc4400, #ee6622);
            margin-top: 8px;
        }

        .aviso {
            background: rgba(0, 100, 200, 0.1);
            border: 1px solid #0088cc;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #aaddff;
            line-height: 1.5;
        }

        .sucesso {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0, 200, 100, 0.15);
            border: 1px solid #00cc66;
            border-radius: 8px;
            color: #88ffbb;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="caixa">
    <h1>📚 CONVERSOR DE TEXTO PARA EPUB</h1>

    <div class="aviso">
        ✅ <strong>Como usar:</strong><br>
        1. Escreva ou cole o nome do livro<br>
        2. Cole o texto do livro na caixa grande<br>
        3. Toque em <strong>GERAR EPUB</strong> → baixa pronto!
    </div>

    <div class="campo">
        <label>📖 Nome do Livro</label>
        <input type="text" id="nomeLivro" placeholder="Digite o nome do livro...">
    </div>

    <div class="campo">
        <label>✍️ Texto do Livro — COLE AQUI</label>
        <textarea id="textoLivro" placeholder="Cole o texto do seu livro aqui...&#10;&#10;Cada parágrafo vai aparecer certinho no EPUB."></textarea>
    </div>

    <button class="botao" onclick="criarEPUB()">📦 GERAR EPUB</button>
    <button class="botao botao-limpar" onclick="limparTudo()">🗑️ LIMPAR TUDO</button>

    <div class="sucesso" id="mensagemSucesso">
        ✅ EPUB CRIADO COM SUCESSO! 🎉<br>
        O download começou automaticamente!
    </div>
</div>

<script>
async function criarEPUB() {
    const nome = document.getElementById('nomeLivro').value.trim();
    const texto = document.getElementById('textoLivro').value.trim();

    if (!nome) {
        alert('⚠️ Digite o nome do livro!');
        document.getElementById('nomeLivro').focus();
        return;
    }

    if (!texto) {
        alert('⚠️ Cole o texto do livro na caixa!');
        document.getElementById('textoLivro').focus();
        return;
    }

    // Transforma o texto em formato de livro
    const paragrafos = texto.split('\n').filter(p => p.trim() !== '');
    const htmlConteudo = paragrafos.map(p => `<p style="text-align: justify; margin-bottom: 1em; font-size: 1.1em; line-height: 1.6;">${p}</p>`).join('');

    try {
        // Cria o EPUB
        const { epub } = await EpubGenMemory({
            title: nome,
            author: 'Meu Livro',
            content: [
                `<html><body>${htmlConteudo}</body></html>`
            ]
        });

        // Baixa o arquivo
        const blob = new Blob([epub], { type: 'application/epub+zip' });
        const url = URL.createObjectURL(blob);
        
        const link = document.createElement('a');
        link.href = url;
        link.download = `${nome}.epub`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        // Mostra mensagem de sucesso
        document.getElementById('mensagemSucesso').style.display = 'block';
        setTimeout(() => {
            document.getElementById('mensagemSucesso').style.display = 'none';
        }, 5000);

    } catch (erro) {
        alert('❌ Erro: ' + erro.message);
    }
}

function limparTudo() {
    document.getElementById('nomeLivro').value = '';
    document.getElementById('textoLivro').value = '';
    document.getElementById('mensagemSucesso').style.display = 'none';
    document.getElementById('nomeLivro').focus();
}
</script>

</body>
</html>
